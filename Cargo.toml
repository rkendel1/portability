[workspace]
members = [
  "crates/app-capabilities",
  "crates/app-spec",
  "crates/app-manifest",
  "crates/app-compiler",
  "crates/app-runtime",
  "crates/app-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.5"
wasmtime = "48.0.1"
